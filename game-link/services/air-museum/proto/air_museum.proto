syntax = "proto3";

package air_museum;
option go_package = "air-museum/proto/pb;air_museum";
option csharp_namespace = "AirMuseum";

// =============================================================================
// air-museum 設計：兩端共用 auth/validate；其餘各只用一個 WebSocket API。
// - auth/validate：身分一律用 gate.ValidateReq.device（見服務 doc「裝置對照表」）。
//   token 僅選填：uid=<n> 續連；register&name=… 相容舊版首登。勿再使用 key=、勿在 token 內帶 device。
// - 玩家 notify/air_museum/player（PlayerInput）：action=ENTRY|LEAVE|INPUT|SAVE_APPEARANCE
//   SAVE_APPEARANCE：將 name/age/sex 與 avatar_* 寫入 Postgres（uid 以連線為準）
// - Server notify air_museum/add_player（AddPlayerNotify）：推給玩家註冊大螢等（目前於 SAVE_APPEARANCE 成功後）
// - 主畫面 notify/air_museum/state（GameState：state）
// Service：連線、投影↔玩家轉發／廣播。
// 玩家顯示資料請由各端自行處理；Postgres 表 player 由服務啟動時建立（uid、session、name、age、sex、avatar_*、game_score、landing_score、ranking、creattime 等）。
// =============================================================================

// 玩家／投影端動作：此訊息代表什麼操作（entry、leave、input 等）
enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_ENTRY       = 1;  // 入桌
  ACTION_LEAVE       = 2;  // 離桌
  ACTION_INPUT       = 3;  // 遊戲中輸入（axis_x/axis_y/seq 有效）
  ACTION_SAVE_APPEARANCE = 4;  // 儲存裝扮／基本資料至 DB（填 name…avatar_helmet）
}

// 遊戲階段／狀態（可入桌／Demo／遊戲中／滿員）
enum GamePhase {
  GAME_PHASE_UNSPECIFIED   = 0;
  GAME_PHASE_WAITING_ENTRY = 1;  // 可入桌，等待玩家 entry
  GAME_PHASE_DEMO          = 2;  // Demo 狀態
  GAME_PHASE_PLAYING       = 3;  // 遊戲中
  GAME_PHASE_FULL          = 4;  // 滿員
}

// 遊戲狀態：用於 pushGameState（投影端→Server）與 gameStateEvent（Server 廣播→所有玩家）
// 手柄端依 state 與 uids 取得房內成員列表
message GameState {
  GamePhase state = 1;        // 遊戲當前狀態
  repeated uint32 uids = 2;   // 當前房內玩家 uid 列表
}

// 玩家→投影端統一承載：action（entry／leave／input）、uid、輸入軸與序號（input 時使用）
// 玩家送時 uid 可省略，由 Server 轉發時填入；投影端依 action 決定行為
message PlayerInput {
  Action action = 1;   // 此次代表的操作
  uint32 uid = 2;      // 玩家端可不填，Server 轉發時填入
  float axis_x = 3;     // 左右，建議 -1～1（action=INPUT 時使用）
  float axis_y = 4;     // 上下，建議 -1～1（action=INPUT 時使用）
  uint32 seq = 5;       // 序號（action=INPUT 時使用）
  // action=SAVE_APPEARANCE：客戶端填寫，與 PlayerPrefs air_museum_* 對齊；uid 仍以連線為準
  string name = 6;
  uint32 age = 7;
  int32 sex = 8;             // 與客戶端註冊一致；可為 -1 未選
  int32 avatar_eyes = 9;
  int32 avatar_eyebrow = 10;
  int32 avatar_mouth = 11;
  int32 avatar_glasses = 12; // -1 表示未戴眼鏡
  int32 avatar_helmet = 13;
}

// 錯誤通知：Server → Client（notify/error）；client 須訂閱此事件
message ErrorNotify {
  string msg = 1;   // 錯誤訊息，如「主機已重連，請點擊登入重新 entry」
}

// Server→玩家註冊大螢等：推送一名玩家在 DB 之一整列對應欄位（例如在 SAVE_APPEARANCE 成功後由 Server 依 uid 重新讀出）。
message AddPlayerNotify {
  uint32 uid = 1;
  string name = 2;
  uint32 age = 3;
  int32 sex = 4;
  int32 avatar_eyes = 5;
  int32 avatar_eyebrow = 6;
  int32 avatar_mouth = 7;
  int32 avatar_glasses = 8;
  int32 avatar_helmet = 9;
  int32 mission = 10;
  int32 game_score = 11;
  int32 landing_score = 12;
  int32 ranking = 13;
  int64 creattime_unix_seconds = 14;
}
